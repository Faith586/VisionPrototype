<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOLO Shape+Tag Vision Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  .topbar {
    background: #16213e;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #0f3460;
  }
  .topbar h1 {
    font-size: 20px;
    font-weight: 600;
    color: #e94560;
  }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .model-badge {
    background: #e94560;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .fps-badge {
    background: #0f3460;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
  }
  .fps-badge span { color: #00ff88; }

  .main {
    display: flex;
    height: calc(100vh - 50px);
  }

  .feed-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a1a;
    padding: 12px;
    min-width: 0;
  }
  .feed-panel img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    border: 2px solid #0f3460;
  }

  .sidebar {
    width: 340px;
    min-width: 340px;
    background: #16213e;
    display: flex;
    flex-direction: column;
    border-left: 2px solid #0f3460;
    overflow: hidden;
  }

  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid #0f3460;
  }
  .sidebar-section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #888;
    margin-bottom: 10px;
  }

  .current-label {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 4px;
    line-height: 1.2;
  }
  .current-letter {
    display: inline-block;
    font-size: 20px;
    font-weight: 800;
    padding: 2px 10px;
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .current-meta {
    font-size: 13px;
    color: #aaa;
    line-height: 1.6;
  }
  .current-meta strong { color: #ddd; }
  .no-detection {
    color: #555;
    font-style: italic;
    font-size: 16px;
    padding: 12px 0;
  }

  .log-section {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .log-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 8px 16px;
  }
  .log-list::-webkit-scrollbar { width: 6px; }
  .log-list::-webkit-scrollbar-track { background: transparent; }
  .log-list::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

  .log-entry {
    font-size: 13px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    justify-content: space-between;
  }
  .log-entry .time {
    color: #666;
    font-size: 12px;
    margin-right: 8px;
    white-space: nowrap;
  }
  .log-entry .label { font-weight: 600; }
  .log-entry .conf {
    color: #888;
    font-size: 12px;
    white-space: nowrap;
  }

  .stats-section {
    background: #0f3460;
    padding: 14px 16px;
  }
  .stats-section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #888;
    margin-bottom: 8px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .stat-item {
    background: rgba(255,255,255,0.05);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
  }
  .stat-item .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: #e94560;
  }
  .stat-item .stat-label {
    color: #888;
    font-size: 11px;
  }
  .shape-counts {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .shape-chip {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(255,255,255,0.08);
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Shape + Tag Vision Dashboard</h1>
  <div class="topbar-right">
    <span class="model-badge">YOLOv8 &middot; 15 Classes</span>
    <div class="fps-badge">FPS: <span id="fps-value">0.0</span></div>
  </div>
</div>

<div class="main">
  <div class="feed-panel">
    <img id="video-feed" src="/video_feed" alt="Live Camera Feed">
  </div>

  <div class="sidebar">
    <div class="sidebar-section">
      <h2>Current Detection</h2>
      <div id="current-detection">
        <div class="no-detection">Waiting for shape tags...</div>
      </div>
    </div>

    <div class="sidebar-section log-section">
      <h2>Detection Log</h2>
      <div id="log-list" class="log-list"></div>
    </div>

    <div class="stats-section">
      <h2>Statistics</h2>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Total Detections</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-avg-conf">0%</div>
          <div class="stat-label">Avg Confidence</div>
        </div>
      </div>
      <div id="shape-counts" class="shape-counts"></div>
    </div>
  </div>
</div>

<script>
  function updateDashboard() {
    fetch('/api/detections')
      .then(r => r.json())
      .then(data => {
        document.getElementById('fps-value').textContent = data.fps.toFixed(1);

        const cdEl = document.getElementById('current-detection');
        if (data.current) {
          const c = data.current;
          cdEl.innerHTML =
            '<div class="current-label" style="color:' + c.color + '">' +
              c.shape +
            '</div>' +
            '<span class="current-letter" style="background:' + c.tag_color + ';color:#fff">' +
              c.letter +
            '</span>' +
            '<div class="current-meta">' +
              'Confidence: <strong>' + c.conf.toFixed(1) + '%</strong><br>' +
              c.time +
            '</div>';
        } else {
          cdEl.innerHTML = '<div class="no-detection">Waiting for shape tags...</div>';
        }

        const logEl = document.getElementById('log-list');
        let logHtml = '';
        for (const entry of data.log) {
          logHtml +=
            '<div class="log-entry">' +
              '<div><span class="time">[' + entry.time + ']</span>' +
              '<span class="label" style="color:' + entry.color + '">' +
                entry.label +
              '</span></div>' +
              '<div class="conf">' + entry.confidence.toFixed(0) + '%</div>' +
            '</div>';
        }
        logEl.innerHTML = logHtml;

        document.getElementById('stat-total').textContent = data.stats.total;
        document.getElementById('stat-avg-conf').textContent = data.stats.avg_confidence.toFixed(1) + '%';

        const scEl = document.getElementById('shape-counts');
        let scHtml = '';
        for (const [shape, count] of Object.entries(data.stats.shape_counts)) {
          scHtml += '<span class="shape-chip">' + shape + ': ' + count + '</span>';
        }
        scEl.innerHTML = scHtml;
      })
      .catch(() => {});
  }

  setInterval(updateDashboard, 300);
  updateDashboard();
</script>

</body>
</html>
